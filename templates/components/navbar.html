<!-- Top Navbar Component -->
<nav class="navbar">
    <div class="navbar-content">
        
        <!-- Left Side: Toggle & Brand -->
        <div class="nav-brand">
            <!-- Mobile Sidebar Toggle -->
            <button id="sidebarToggle" class="btn btn-icon d-lg-none me-2" style="background:none; border:none; color:var(--text-muted);">
                <i class="fas fa-bars"></i>
            </button>
            <div class="brand-icon-box" style="width:32px;height:32px;background:linear-gradient(135deg,var(--primary),#4f46e5);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:1rem;">
                <i class="fas fa-search-location"></i>
            </div>
            <span class="d-none d-sm-inline">L&F Portal</span>
        </div>
        
        <!-- Center: Quick Search (Optional) -->
        <div class="nav-center d-none d-md-block">
            <form action="{{ url_for('search') }}" method="GET" class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" name="q" placeholder="Search for lost items, places, tags...">
            </form>
        </div>
        
        <!-- Right Side: User Actions -->
        <div class="nav-right">
            <a href="{{ url_for('report_found') }}" class="btn btn-primary btn-sm d-none d-md-flex">
                <i class="fas fa-plus"></i> Report Found Item
            </a>
            
            <a href="{{ url_for('notifications.list_notifications') }}" class="nav-icon" id="notificationLink">
                <i class="far fa-bell"></i>
                <span class="badge badge-danger" id="notificationBadge" style="display: none;">0</span>
            </a>
            
            <a href="{{ url_for('chat') }}" class="nav-icon">
                <i class="far fa-comment-dots"></i>
            </a>
            
            <div class="user-dropdown-toggle ms-2" style="cursor:pointer;">
                <div class="avatar">
                    {% if current_user %}
                        {{ current_user.first_name[0] | upper }}
                    {% else %}
                        U
                    {% endif %}
                </div>
                <span class="d-none d-sm-inline">{{ current_user.first_name if current_user else 'User' }}</span>
                <i class="fas fa-chevron-down text-small text-muted ms-1"></i>
            </div>
        </div>
    </div>
</nav>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Lost & Found Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body register-page">
    <div class="auth-container-centered">
        <div class="auth-card">
            <div class="auth-form-container text-center">
                <h2>Create Account</h2>
                <p class="subtitle text-muted mb-4 font-weight-500">Join our portal today</p>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} mb-3 fade-in">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="form-group mb-3 text-left">
                        <div class="input-icon-wrapper mockup-input">
                            <i class="far fa-user"></i>
                            <input type="text" id="first_name" name="first_name" class="form-control" placeholder="First Name" required>
                        </div>
                    </div>

                    <div class="form-group mb-3 text-left">
                        <div class="input-icon-wrapper mockup-input">
                            <i class="far fa-user"></i>
                            <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Last Name" required>
                        </div>
                    </div>
                    
                    <div class="form-group mb-3 text-left">
                        <div class="input-icon-wrapper mockup-input">
                            <i class="far fa-envelope"></i>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Email Address" required>
                        </div>
                    </div>
                    
                    <div class="form-group mb-3 text-left">
                        <div class="input-icon-wrapper mockup-input">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                            <button type="button" class="password-toggle"><i class="far fa-eye"></i></button>
                        </div>
                    </div>

                    <div class="form-group mb-4 text-left">
                        <div class="input-icon-wrapper mockup-input">
                            <i class="fas fa-phone-alt"></i>
                            <input type="text" id="phone" name="phone" class="form-control" placeholder="Phone Number (Optional)">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-large font-weight-600 py-3 mb-4 rounded-lg">Register</button>
                </form>
                
                <p class="text-center text-muted font-weight-500">
                    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary font-weight-600">Login here</a>
                </p>
            </div>
            
            <div class="auth-card-footer-img">
                <img src="{{ url_for('static', filename='images/login-landscape.svg') }}" alt="Cityscape with trees">
            </div>
        </div>
    </div>

    <!-- Client-side Validation -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - LF Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body change-password-page">
    <div class="auth-container-centered">
        <div class="auth-card">
            <div class="auth-form-container text-center">
                <h2>Change Password</h2>
                <p class="subtitle text-muted mb-4 font-weight-500">Secure your account</p>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} mb-3 fade-in">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.change_password_view') }}">
                    <div class="form-group mb-3 text-left">
                        <div class="input-icon-wrapper mockup-input">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="current_password" class="form-control" placeholder="Current Password" required>
                            <button type="button" class="password-toggle"><i class="far fa-eye"></i></button>
                        </div>
                    </div>
                    
                    <div class="form-group mb-3 text-left">
                        <div class="input-icon-wrapper mockup-input">
                            <i class="fas fa-key"></i>
                            <input type="password" name="new_password" class="form-control" placeholder="New Password" required>
                            <button type="button" class="password-toggle"><i class="far fa-eye"></i></button>
                        </div>
                    </div>
                    
                    <div class="form-group mb-3 text-left">
                        <div class="input-icon-wrapper mockup-input">
                            <i class="fas fa-check-double"></i>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm New Password" required>
                            <button type="button" class="password-toggle"><i class="far fa-eye"></i></button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-large font-weight-600 py-3 mb-4 rounded-lg mt-4">Change Password</button>
                </form>
                
                <p class="text-center text-muted font-weight-500">
                    <a href="{{ url_for('dashboard') }}" class="text-primary font-weight-600">Back to Dashboard</a>
                </p>
            </div>
            
            <div class="auth-card-footer-img">
                <img src="{{ url_for('static', filename='images/login-landscape.svg') }}" alt="Cityscape with trees">
            </div>
        </div>
    </div>

    <!-- Client-side Validation -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>

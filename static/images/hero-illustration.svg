<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Soft blue blob background -->
  <ellipse cx="300" cy="260" rx="250" ry="200" fill="#EBF2FF" opacity="0.7"/>
  <ellipse cx="320" cy="280" rx="220" ry="180" fill="#DCEAFF" opacity="0.5"/>
  
  <!-- Floating circles -->
  <circle cx="80" cy="120" r="12" fill="#C7D8FF" opacity="0.6"/>
  <circle cx="520" cy="100" r="18" fill="#B8CCFF" opacity="0.5"/>
  <circle cx="540" cy="380" r="10" fill="#D4E3FF" opacity="0.7"/>
  <circle cx="60" cy="350" r="8" fill="#C7D8FF" opacity="0.5"/>
  <circle cx="150" cy="80" r="6" fill="#B8CCFF" opacity="0.4"/>
  <circle cx="480" cy="60" r="8" fill="#D4E3FF" opacity="0.6"/>
  
  <!-- Shadow under all objects -->
  <ellipse cx="300" cy="430" rx="200" ry="18" fill="#000" opacity="0.06"/>
  
  <!-- ===== BACKPACK ===== -->
  <g transform="translate(200, 80)">
    <!-- Backpack shadow -->
    <ellipse cx="100" cy="320" rx="95" ry="12" fill="#000" opacity="0.08"/>
    
    <!-- Main body -->
    <rect x="20" y="80" width="160" height="240" rx="30" fill="#2563EB"/>
    <rect x="20" y="80" width="160" height="240" rx="30" fill="url(#backpackGrad)"/>
    
    <!-- Top flap -->
    <path d="M50 80 Q100 40 150 80" fill="#1D4ED8" stroke="none"/>
    <rect x="50" y="50" width="100" height="40" rx="20" fill="#2563EB"/>
    <rect x="50" y="50" width="100" height="40" rx="20" fill="url(#backpackTopGrad)"/>
    
    <!-- Handle -->
    <rect x="80" y="35" width="40" height="20" rx="10" fill="#1E40AF"/>
    <rect x="85" y="30" width="30" height="15" rx="7" fill="#2563EB"/>
    
    <!-- Front pocket -->
    <rect x="40" y="180" width="120" height="100" rx="20" fill="#1D4ED8" opacity="0.4"/>
    <rect x="45" y="185" width="110" height="90" rx="18" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    
    <!-- Pocket zipper line -->
    <line x1="60" y1="185" x2="140" y2="185" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <circle cx="130" cy="185" r="4" fill="#93C5FD"/>
    
    <!-- Side straps -->
    <rect x="8" y="120" width="16" height="140" rx="8" fill="#1E40AF"/>
    <rect x="176" y="120" width="16" height="140" rx="8" fill="#1E40AF"/>
    
    <!-- Zipper detail top -->
    <line x1="55" y1="82" x2="145" y2="82" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="82" r="3.5" fill="#93C5FD"/>
    
    <!-- Logo circle on pocket -->
    <circle cx="100" cy="230" r="18" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.6"/>
    <path d="M92 230 Q100 220 108 230" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- ===== SMARTPHONE ===== -->
  <g transform="translate(380, 160)">
    <!-- Phone shadow -->
    <ellipse cx="40" cy="250" rx="35" ry="8" fill="#000" opacity="0.08"/>
    
    <!-- Phone body -->
    <rect x="5" y="10" width="70" height="240" rx="12" fill="#1E293B"/>
    <rect x="5" y="10" width="70" height="240" rx="12" fill="url(#phoneGrad)"/>
    
    <!-- Screen -->
    <rect x="10" y="20" width="60" height="220" rx="8" fill="#0F172A"/>
    
    <!-- Screen content (time) -->
    <text x="40" y="90" text-anchor="middle" fill="#E2E8F0" font-size="18" font-family="sans-serif" font-weight="600">12:45</text>
    
    <!-- Screen icons row -->
    <circle cx="25" cy="130" r="8" fill="#2563EB" opacity="0.5"/>
    <circle cx="45" cy="130" r="8" fill="#10B981" opacity="0.5"/>
    <circle cx="65" cy="130" r="8" fill="#F59E0B" opacity="0.5"/>
    
    <!-- Camera notch -->
    <rect x="25" y="14" width="30" height="6" rx="3" fill="#0F172A"/>
    
    <!-- Home indicator -->
    <rect x="25" y="232" width="30" height="4" rx="2" fill="#334155"/>
    
    <!-- Screen shine -->
    <rect x="10" y="20" width="20" height="220" rx="8" fill="white" opacity="0.03"/>
  </g>
  
  <!-- ===== WALLET ===== -->
  <g transform="translate(200, 340)">
    <!-- Wallet shadow -->
    <ellipse cx="80" cy="65" rx="70" ry="8" fill="#000" opacity="0.1"/>
    
    <!-- Wallet body -->
    <rect x="10" y="5" width="140" height="55" rx="8" fill="#92400E"/>
    <rect x="10" y="5" width="140" height="55" rx="8" fill="url(#walletGrad)"/>
    
    <!-- Wallet fold line -->
    <line x1="80" y1="8" x2="80" y2="57" stroke="#78350F" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Wallet flap -->
    <rect x="10" y="5" width="70" height="55" rx="8" fill="#A16207" opacity="0.3"/>
    
    <!-- Card peek -->
    <rect x="95" y="12" width="45" height="28" rx="4" fill="#E5E7EB" opacity="0.6"/>
    <rect x="98" y="15" width="39" height="22" rx="3" fill="#F3F4F6" opacity="0.5"/>
    
    <!-- Wallet stitching -->
    <line x1="15" y1="10" x2="15" y2="55" stroke="#B45309" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <line x1="145" y1="10" x2="145" y2="55" stroke="#B45309" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    
    <!-- Wallet clasp -->
    <circle cx="80" cy="8" r="5" fill="#D97706" stroke="#B45309" stroke-width="1"/>
  </g>
  
  <!-- ===== KEYS ===== -->
  <g transform="translate(360, 370)">
    <!-- Key shadow -->
    <ellipse cx="60" cy="55" rx="55" ry="6" fill="#000" opacity="0.06"/>
    
    <!-- Keyring -->
    <circle cx="35" cy="15" r="14" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="35" cy="15" r="14" fill="none" stroke="url(#keyringGrad)" stroke-width="3"/>
    
    <!-- Key 1 -->
    <g transform="translate(48, 10) rotate(25)">
      <rect x="0" y="-3" width="50" height="6" rx="3" fill="#9CA3AF"/>
      <rect x="0" y="-3" width="50" height="6" rx="3" fill="url(#keyGrad1)"/>
      <rect x="42" y="-6" width="8" height="5" rx="1" fill="#6B7280"/>
      <rect x="38" y="-6" width="8" height="5" rx="1" fill="#6B7280"/>
      <rect x="46" y="-8" width="6" height="4" rx="1" fill="#6B7280"/>
    </g>
    
    <!-- Key 2 -->
    <g transform="translate(48, 20) rotate(40)">
      <rect x="0" y="-3" width="45" height="6" rx="3" fill="#D1D5DB"/>
      <rect x="0" y="-3" width="45" height="6" rx="3" fill="url(#keyGrad2)"/>
      <rect x="38" y="-5" width="7" height="4" rx="1" fill="#9CA3AF"/>
      <rect x="34" y="-5" width="7" height="4" rx="1" fill="#9CA3AF"/>
    </g>
  </g>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="backpackGrad" x1="100" y1="80" x2="100" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="backpackTopGrad" x1="100" y1="50" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="40" y1="10" x2="40" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="walletGrad" x1="80" y1="5" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="keyringGrad" x1="35" y1="0" x2="35" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="keyGrad1" x1="0" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D1D5DB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6B7280" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="keyGrad2" x1="0" y1="0" x2="45" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5E7EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>
